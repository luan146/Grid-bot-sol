name: Bot ao vivo

# Roda o grid (dinheiro de mentira) a cada ~10 minutos. O GitHub às vezes atrasa
# o agendamento; não tem problema, o bot processa todos os minutos que ficaram para trás.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  push:
    paths: ["config.json", ".github/workflows/bot.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-ao-vivo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar o bot
        run: python bot/ao_vivo.py
      - name: Salvar estado
        run: |
          git config user.name "grid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado.json
          git commit -q -m "Bot: rodada $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((i*3)); done
